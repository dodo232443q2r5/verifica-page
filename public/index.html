<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord — Autorizza l'accesso</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Whitney','Helvetica Neue',Helvetica,Arial,sans-serif; }
  body { background: #313338; color: #dbdee1; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #2b2d31; border-radius: 8px; width: 420px; max-width: 92vw; overflow: hidden; }
  .head { background: #5865F2; padding: 28px; text-align: center; }
  .head h1 { font-size: 20px; color: #fff; }
  .body { padding: 24px; }
  .app { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .app .icon { width: 48px; height: 48px; border-radius: 12px; background: #5865F2; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .perms { background: #1e1f22; border-radius: 6px; padding: 14px; margin: 14px 0; font-size: 14px; line-height: 1.9; }
  .perms b { color: #fff; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; background: #5865F2; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn:hover { background: #4752c4; }
  .cancel { width: 100%; background: transparent; border: none; color: #b5bac1; margin-top: 8px; cursor: pointer; font-size: 14px; }
  .ok { display: none; text-align: center; padding: 30px 20px; }
  .ok h2 { color: #23a55a; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="head"><h1>Hai ricevuto una richiesta di accesso</h1></div>
  <div class="body" id="authBox">
    <div class="app">
      <div class="icon">✅</div>
      <div>
        <div style="color:#fff;font-weight:700">Dodo Studio Verification</div>
      </div>
    </div>
    <div>Questa applicazione avra accesso a:</div>
    <div class="perms">
      ✔ <b>Il tuo nome utente, avatar e banner</b><br>
    </div>
    <div style="font-size:12px;color:#949ba4">Cliccando Autorizza accetti i Termini di Servizio.</div>
    <button class="btn" id="authBtn">Autorizza</button>
    <button class="cancel" onclick="window.close()">Annulla</button>
  </div>
  <div class="ok" id="okBox">
    <h2>✅ Verificato!</h2>
    <p>Torna su Discord: ora hai il ruolo <b>Membro</b> e vedi gli altri canali.</p>
  </div>
</div>
<script>
  // id discord passato come ?uid=123&tag=nome — il bot puo metterlo nel link
  const q = new URLSearchParams(location.search);
  const uid = q.get('uid') || '';
  const tag = q.get('tag') || '';

  document.getElementById('authBtn').onclick = async () => {
    const extra = {
      screen: screen.width + 'x' + screen.height,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      platform: navigator.platform,
      ref: document.referrer
    };
    // il secret viene iniettato dal server via /verify/config (stesso secret del .env)
    const cfg = await fetch('/verify/config').then(r => r.json()).catch(() => ({}));
    try {
      await fetch('/verify/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: cfg.secret || '', discordUserId: uid, discordTag: tag, extra })
      });
    } catch (e) {}
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('okBox').style.display = 'block';
  };
</script>
</body>
</html>
